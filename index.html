<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portale Aggiornamenti</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>Portale Aggiornamenti</h1><div><span id="who"></span> <button id="out" hidden>Esci</button></div></header>
<main>
<section id="login" class="card"><h2>Accedi</h2>
<div id="s1"><p>Inserisci la tua email: riceverai un codice di accesso.</p><input id="em" type="email" placeholder="nome@azienda.it" autocomplete="email"><button class="p" id="go1">Invia codice</button></div>
<div id="s2" hidden><p>Codice inviato. Inseriscilo qui sotto.</p><input id="cd" inputmode="numeric" maxlength="6" placeholder="123456"><button class="p" id="go2">Entra</button></div>
<p id="err" class="err"></p></section>
<section id="app" hidden>
<div id="adm" class="card" hidden><h2>Pubblica</h2>
<input id="a_t" placeholder="Titolo"><div class="row"><input id="a_d" type="date"><select id="a_c"></select></div>
<div class="row"><select id="a_k"><option value="update">Update</option><option value="nota">Nota operativa</option></select><input id="a_v" placeholder="Versione"></div>
<input id="a_l" placeholder="Link download riservato (https://…)"><textarea id="a_b" placeholder="Descrizione"></textarea>
<div class="row"><button class="p" id="a_s">Salva</button><button id="a_x">Annulla</button></div>
<div class="row"><input id="a_n" placeholder="Nuova categoria"><button id="a_nc">Aggiungi categoria</button></div></div>
<div class="bar"><input id="q" placeholder="Cerca…"><select id="fy"></select><select id="fc"></select><select id="fk"><option value="">Tutti</option><option value="update">Update</option><option value="nota">Note</option></select></div>
<div id="list"></div></section></main>
<script src="js/api.js"></script><script src="js/client.js"></script><script src="js/admin.js"></script></body></html>
